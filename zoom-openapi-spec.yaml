openapi: 3.0.3
info:
  title: Phoenix AI - Zoom Integration
  description: |
    Phoenix AI Zoom Connector - Enables Phoenix to manage Zoom meetings through voice commands and AI automation.

    Phoenix is an AI life operating system that can:
    - Schedule and create Zoom meetings via natural language
    - List upcoming meetings
    - Join meetings automatically
    - Sync meetings with calendar
  version: 1.0.0
  contact:
    name: Phoenix AI Support
    url: https://phoenix-fe-indol.vercel.app
    email: support@phoenix-ai.com

servers:
  - url: https://pal-backend-production.up.railway.app/api/zoom
    description: Production server

security:
  - bearerAuth: []

paths:
  /status:
    get:
      summary: Check Zoom connection status
      description: Returns whether the user has connected their Zoom account
      operationId: getZoomStatus
      tags:
        - Connection
      responses:
        '200':
          description: Connection status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  connected:
                    type: boolean
                    description: Whether user has connected Zoom
                  configured:
                    type: boolean
                    description: Whether OAuth is configured
                  mode:
                    type: string
                    example: user_oauth
                  canConnect:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /connect:
    get:
      summary: Get Zoom OAuth URL
      description: Returns the OAuth authorization URL for user to connect their Zoom account
      operationId: getZoomConnectUrl
      tags:
        - Connection
      responses:
        '200':
          description: OAuth URL returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  authUrl:
                    type: string
                    format: uri
                    description: URL to redirect user for Zoom authorization
                  message:
                    type: string
        '500':
          $ref: '#/components/responses/ServerError'

  /callback:
    get:
      summary: OAuth callback endpoint
      description: Handles the OAuth callback from Zoom after user authorization
      operationId: zoomCallback
      tags:
        - Connection
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Authorization code from Zoom
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: User ID for session verification
      responses:
        '302':
          description: Redirects to frontend with connection status
          headers:
            Location:
              schema:
                type: string
                format: uri

  /disconnect:
    post:
      summary: Disconnect Zoom account
      description: Removes Zoom tokens and disconnects the user's Zoom account
      operationId: disconnectZoom
      tags:
        - Connection
      responses:
        '200':
          description: Successfully disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /meetings:
    get:
      summary: List upcoming meetings
      description: Returns a list of the user's upcoming Zoom meetings
      operationId: listMeetings
      tags:
        - Meetings
      responses:
        '200':
          description: List of meetings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  meetings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Meeting'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      summary: Create a new meeting
      description: Creates a new Zoom meeting for the authenticated user
      operationId: createMeeting
      tags:
        - Meetings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                topic:
                  type: string
                  description: Meeting topic/title
                  example: Phoenix Team Sync
                startTime:
                  type: string
                  format: date-time
                  description: Meeting start time (ISO 8601). Omit for instant meeting.
                duration:
                  type: integer
                  description: Meeting duration in minutes
                  default: 60
                agenda:
                  type: string
                  description: Meeting agenda/description
      responses:
        '200':
          description: Meeting created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  meeting:
                    $ref: '#/components/schemas/MeetingCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /meetings/{id}:
    get:
      summary: Get meeting details
      description: Returns details for a specific meeting
      operationId: getMeeting
      tags:
        - Meetings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Zoom meeting ID
      responses:
        '200':
          description: Meeting details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  meeting:
                    $ref: '#/components/schemas/Meeting'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Meeting not found
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      summary: Delete a meeting
      description: Deletes/cancels a scheduled meeting
      operationId: deleteMeeting
      tags:
        - Meetings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Zoom meeting ID
      responses:
        '200':
          description: Meeting deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Meeting not found
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Phoenix JWT authentication token

  schemas:
    Meeting:
      type: object
      properties:
        id:
          type: string
          description: Zoom meeting ID
        topic:
          type: string
          description: Meeting topic
        start_time:
          type: string
          format: date-time
        duration:
          type: integer
          description: Duration in minutes
        join_url:
          type: string
          format: uri
        host_id:
          type: string
        created_at:
          type: string
          format: date-time

    MeetingCreated:
      type: object
      properties:
        id:
          type: string
        topic:
          type: string
        joinUrl:
          type: string
          format: uri
        startUrl:
          type: string
          format: uri
          description: URL for host to start meeting
        password:
          type: string
        startTime:
          type: string
          format: date-time
        duration:
          type: integer

  responses:
    Unauthorized:
      description: Authentication required or Zoom not connected
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
              needsAuth:
                type: boolean

    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string

tags:
  - name: Connection
    description: Zoom account connection management
  - name: Meetings
    description: Zoom meeting operations
